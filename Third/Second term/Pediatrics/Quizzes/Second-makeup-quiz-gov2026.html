<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمريضولوجي - الكويز التعويضي الثاني حكومي 2026</title>
    <style>
        :root {
            --primary: #008080;
            --secondary: #004d4d;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --success: #2e7d32;
            --danger: #c62828;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        .front-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 450px;
            opacity: 0.25;
            z-index: 9999;
            pointer-events: none;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
        }
        header {
            text-align: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        header h1 { color: var(--primary); margin: 0; font-size: 24px; }
        .links { margin-top: 10px; }
        .links a {
            display: inline-block;
            margin: 0 5px;
            text-decoration: none;
            color: #fff;
            background: var(--primary);
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 13px;
            transition: 0.3s;
        }
        .links a:hover { background: var(--secondary); }
        
        .setup-screen, .quiz-screen, .result-screen { display: none; }
        .active { display: block; }
        
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;}
        .form-group.checkbox { display: flex; align-items: center; justify-content: flex-start; flex-direction: row-reverse;}
        .form-group.checkbox input { margin-left: 10px; width: 20px; height: 20px; }
        
        .btn {
            padding: 12px 25px;
            background: var(--primary); color: #fff;
            border: none; border-radius: 5px;
            font-size: 16px; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background: var(--secondary); }
        .btn-block { display: block; width: 100%; padding: 15px; font-size: 18px; }
        
        .timer-bar {
            display: flex; justify-content: space-between;
            background: #ffebee; color: var(--danger);
            padding: 10px; border-radius: 5px; font-weight: bold;
            margin-bottom: 25px;
        }

        .nav-dots {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 15px;
        }
        .dot {
            display: inline-block;
            width: 35px;
            height: 35px;
            line-height: 35px;
            margin: 4px;
            background: #e0e0e0;
            color: #333;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            transition: 0.2s;
        }
        .dot.active {
            border: 2px solid var(--primary);
            background: #b2dfdb;
            color: var(--secondary);
        }
        .dot.answered {
            background: var(--primary);
            color: #fff;
        }
        
        .question-box { margin-bottom: 25px; text-align: left; direction: ltr;}
        .question-text { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: var(--secondary);}
        .options { list-style: none; padding: 0; }
        .options li {
            background: #e0f2f1; margin-bottom: 10px;
            padding: 14px; border-radius: 5px; cursor: pointer;
            transition: 0.2s; border: 1px solid transparent;
        }
        .options li:hover { background: #b2dfdb; }
        .options li.selected { background: var(--primary); color: #fff; font-weight: bold; }

        .quiz-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .result-screen { text-align: center; }
        .score-circle {
            width: 130px; height: 130px; border-radius: 50%;
            background: var(--primary); color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: bold; margin: 0 auto 20px;
        }

        .review-section { margin-top: 30px; border-top: 2px solid var(--primary); padding-top: 20px; }
        .review-item {
            background: #fdfdfd; border: 1px solid #e0e0e0;
            border-radius: 8px; padding: 15px; margin-bottom: 15px;
            text-align: left; direction: ltr;
        }
        .review-item.item-correct { border-left: 5px solid var(--success); }
        .review-item.item-wrong { border-left: 5px solid var(--danger); }
        
        .review-options { list-style: none; padding: 0; margin-top: 10px; }
        .review-options li { padding: 8px; margin-bottom: 4px; border-radius: 4px; }
        .review-options li.rev-correct { background: #e8f5e9; color: var(--success); font-weight: bold; }
        .review-options li.rev-wrong { background: #ffebee; color: var(--danger); text-decoration: line-through; }
    </style>
</head>
<body>

<img class="front-logo" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhIt1bXXa9kD1APc8qcfG9r-s-lmI_3C6Kg13rCIvfgPkMlXpBOud245tlNkAdnGQHEH6dNeYIn8OhziKzqcteGbRyAiZry4C0raemhyIsC-_BjpcPxZM4cHb13JGjRPNXagxJR27aj7SAnQDc14ciVx5JEHlLuu3Nju7i-geTkdZK4ySIHlL9p6ULremM/s16000/%D8%AA%D9%85%D8%B1%D9%8A%D8%B6%D9%88%D9%84%D9%88%D8%AC%D9%8A%20%D9%84%D9%88%D8%AC%D9%88%20png.png" alt="Logo">

<div class="container">
    <header>
        <h1>تمريضولوجي - الكويز التعويضي الثاني حكومي 2026</h1>
        <div class="links">
            <a href="https://t.me/Nursingology2025" target="_blank">قناة التليجرام</a>
            <a href="https://t.me/NursBeniSuefBot" target="_blank">بوت الدفعة</a>
        </div>
    </header>

    <div id="setup-screen" class="setup-screen active">
        <h2>إعدادات الاختبار</h2>
        <div class="form-group">
            <label for="time-limit">مدة الاختبار (بالدقائق) - [ضع 0 لإلغاء الوقت]:</label>
            <input type="number" id="time-limit" value="10" min="0">
        </div>
        <div class="form-group checkbox">
            <label for="randomize">ترتيب عشوائي للأسئلة</label>
            <input type="checkbox" id="randomize" checked>
        </div>
        <button class="btn btn-block" onclick="startQuiz()">ابدأ الاختبار 🚀</button>
    </div>

    <div id="quiz-screen" class="quiz-screen">
        <div class="timer-bar" id="timer-bar" style="display:none;">
            <span>الوقت المتبقي:</span>
            <span id="time-display">00:00</span>
        </div>

        <div class="nav-dots" id="nav-dots"></div>

        <div class="question-box">
            <div id="q-text" class="question-text"></div>
            <ul id="options-list" class="options"></ul>
        </div>

        <div class="quiz-controls">
            <button class="btn" id="prev-btn" onclick="prevQuestion()">السؤال السابق</button>
            <button class="btn" id="next-btn" onclick="nextQuestion()">السؤال التالي</button>
            <button class="btn" id="finish-btn" onclick="endQuiz()" style="background-color: var(--success); display:none;">إنهاء الاختبار وعرض النتيجة</button>
        </div>
    </div>

    <div id="result-screen" class="result-screen">
        <h2>النتيجة النهائية</h2>
        <div class="score-circle" id="score-display">0 / 10</div>
        <p id="feedback-msg" style="font-size: 18px; font-weight: bold; color: var(--secondary);"></p>
        <button class="btn" onclick="location.reload()" style="margin-bottom: 20px;">إعادة الاختبار 🔄</button>
        
        <div class="review-section">
            <h3>مراجعة تفصيلية للأسئلة والإجابات الصحيحة:</h3>
            <div id="review-container"></div>
        </div>
    </div>
</div>

<script>
    const originalQuestions = [
        { q: "1. Heart failure occurs due to?", options: ["A. Nephritic", "B. Myocarditis", "C. Hypothyroidism", "D. Hypotension"], answer: 1 },
        { q: "2. Rheumatic fever major criteria includes?", options: ["A. Fever", "B. Arthralgia", "C. Carditis", "D. Arrhythmia"], answer: 2 },
        { q: "3. Pre Renal failure occurs due to?", options: ["A. Edema", "B. Dehydration", "C. Urinary stones", "D. Hypertension"], answer: 1 },
        { q: "4. Meningitis clinical presentation?", options: ["A. Fever", "B. Fever, convulsions", "C. Edema", "D. Hypoglycemia"], answer: 1 },
        { q: "5. Gastroenteritis may cause dehydration?", options: ["A. True", "B. False"], answer: 0 },
        { q: "6. Rickets is vit D deficiency?", options: ["A. True", "B. False"], answer: 0 },
        { q: "7. In marasmus clinical presentation?", options: ["A. Obesity", "B. Edema", "C. Loss of weight", "D. Fever"], answer: 2 },
        { q: "8. In kwashiorkor clinical picture?", options: ["A. Increased muscle fat ratio", "B. Edema", "C. Loss of subcutaneous fat", "D. Fever"], answer: 1 },
        { q: "9. Measles causes vesicular rash?", options: ["A. True", "B. False"], answer: 1 },
        { q: "10. Baby can support his head at age of?", options: ["A. 2 years", "B. 9 months", "C. 3 months", "D. 12 months"], answer: 2 }
    ];

    let questions = [];
    let currentQIndex = 0;
    let timerInterval;
    let timeRemaining;

    function shuffleArray(array) {
        let shuffled = JSON.parse(JSON.stringify(array));
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    function startQuiz() {
        const timeInput = parseInt(document.getElementById('time-limit').value);
        const randomize = document.getElementById('randomize').checked;
        let baseQuestions = randomize ? shuffleArray(originalQuestions) : JSON.parse(JSON.stringify(originalQuestions));
        questions = baseQuestions.map(q => ({ ...q, userAnswer: null }));
        document.getElementById('setup-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        if (timeInput > 0) {
            timeRemaining = timeInput * 60;
            document.getElementById('timer-bar').style.display = 'flex';
            updateTimerDisplay();
            timerInterval = setInterval(timerTick, 1000);
        }
        buildNavDots();
        goToQuestion(0);
    }

    function timerTick() {
        timeRemaining--;
        updateTimerDisplay();
        if (timeRemaining <= 0) { clearInterval(timerInterval); alert('انتهى الوقت!'); endQuiz(); }
    }

    function updateTimerDisplay() {
        const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        const s = (timeRemaining % 60).toString().padStart(2, '0');
        document.getElementById('time-display').innerText = `${m}:${s}`;
    }

    function buildNavDots() {
        const dotsContainer = document.getElementById('nav-dots');
        dotsContainer.innerHTML = '';
        questions.forEach((_, index) => {
            const dot = document.createElement('span');
            dot.className = 'dot';
            dot.id = `dot-${index}`;
            dot.innerText = index + 1;
            dot.onclick = () => goToQuestion(index);
            dotsContainer.appendChild(dot);
        });
    }

    function goToQuestion(index) {
        currentQIndex = index;
        questions.forEach((q, idx) => {
            const dot = document.getElementById(`dot-${idx}`);
            dot.className = 'dot';
            if (idx === currentQIndex) dot.classList.add('active');
            if (q.userAnswer !== null) dot.classList.add('answered');
        });
        document.getElementById('prev-btn').style.visibility = (currentQIndex === 0) ? 'hidden' : 'visible';
        if (currentQIndex === questions.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('finish-btn').style.display = 'inline-block';
        } else {
            document.getElementById('next-btn').style.display = 'inline-block';
            document.getElementById('finish-btn').style.display = 'none';
        }
        const qData = questions[currentQIndex];
        document.getElementById('q-text').innerText = qData.q;
        const optsList = document.getElementById('options-list');
        optsList.innerHTML = '';
        qData.options.forEach((opt, oIdx) => {
            const li = document.createElement('li');
            li.innerText = opt;
            if (qData.userAnswer === oIdx) li.classList.add('selected');
            li.onclick = () => selectOption(oIdx);
            optsList.appendChild(li);
        });
    }

    function selectOption(oIdx) {
        questions[currentQIndex].userAnswer = oIdx;
        const allOpts = document.querySelectorAll('.options li');
        allOpts.forEach(opt => opt.classList.remove('selected'));
        allOpts[oIdx].classList.add('selected');
        document.getElementById(`dot-${currentQIndex}`).classList.add('answered');
    }

    function prevQuestion() { if (currentQIndex > 0) goToQuestion(currentQIndex - 1); }
    function nextQuestion() { if (currentQIndex < questions.length - 1) goToQuestion(currentQIndex + 1); }

    function endQuiz() {
        clearInterval(timerInterval);
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        let finalScore = 0;
        const reviewContainer = document.getElementById('review-container');
        reviewContainer.innerHTML = '';
        questions.forEach((q, index) => {
            const isCorrect = (q.userAnswer === q.answer);
            if (isCorrect) finalScore++;
            const item = document.createElement('div');
            item.className = `review-item ${isCorrect ? 'item-correct' : 'item-wrong'}`;
            const qTitle = document.createElement('h4');
            qTitle.innerText = `${index + 1}. ${q.q}`;
            qTitle.style.margin = '0 0 10px 0';
            qTitle.style.color = isCorrect ? 'var(--success)' : 'var(--danger)';
            item.appendChild(qTitle);
            const uList = document.createElement('ul');
            uList.className = 'review-options';
            q.options.forEach((opt, oIdx) => {
                const li = document.createElement('li');
                li.innerText = opt;
                if (oIdx === q.answer) { li.classList.add('rev-correct'); li.innerText += " ✓ (الإجابة الصحيحة)"; }
                else if (oIdx === q.userAnswer && !isCorrect) { li.classList.add('rev-wrong'); li.innerText += " ✗ (إجابتك الخطأ)"; }
                uList.appendChild(li);
            });
            item.appendChild(uList);
            reviewContainer.appendChild(item);
        });
        document.getElementById('score-display').innerText = `${finalScore} / ${questions.length}`;
    }
</script>
</body>
</html>
